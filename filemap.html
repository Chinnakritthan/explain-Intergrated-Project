    { id:'backend/src/repositories/schedule.repository.js', layer:'db', sprints:[1,2,3], grp:'Backend · Repositories & Utils',

    { id:'backend/src/repositories/lecturer.repository.js', layer:'db', sprints:[3], grp:'Backend · Repositories & Utils',
      desc:'Query ตาราง lecturers, schedule_lecturer และ sessions ของอาจารย์',
      imports:['backend/src/config/prisma.js'], alt:'—' },
    { id:'backend/src/repositories/academic.repository.js', layer:'db', sprints:[3], grp:'Backend · Repositories & Utils',
      desc:'Query ตาราง academic_settings, academic_weeks และ holidays',
      imports:['backend/src/config/prisma.js'], alt:'—' },

      desc:'แปลงเวลาเป็น HH:MM (UTC) และปั้น shape JSON ให้ตรง TR-08 สำหรับ Guest, Year-Level และ Lecturer',

      desc:'คำนวณช่วงวันจันทร์–อาทิตย์ (startDate, endDate) จากวันที่ใดก็ได้ในสัปดาห์นั้น',
      imports:[], alt:'ใช้ date-fns (startOfWeek / endOfWeek)' },

    // DB & Infra
    { id:'backend/prisma/schema.prisma', layer:'db', sprints:[1,2,3], grp:'Database & CI',

      imports:['database/init.sql','backend/prisma/schema.prisma','backend/src/server.js'],
      alt:'แยกสคริปต์เทสออกมาเป็น Vitest + Supertest เพื่อให้รันบนเครื่องนักพัฒนาได้ด้วย' },
  ];

  // Build reverse index (importedBy)
  const map = new Map(FILES.map(f => [f.id, { ...f, importedBy: [] }]));
  for (const f of map.values()) {
    for (const target of f.imports) {
      if (map.has(target)) map.get(target).importedBy.push(f.id);
    }
  }

  let activeLayer = 'all';
  let activeSprint = null;
  let search = '';
  let selectedId = 'frontend/js/my-schedule-main.js';

  const listEl = document.getElementById('fm-list');
  const detailEl = document.getElementById('fm-detail');
  const searchEl = document.getElementById('fm-search');

  function renderList() {
    const sel = map.get(selectedId);
    const related = new Set(sel ? [sel.id, ...sel.imports, ...sel.importedBy] : []);

    const filtered = [...map.values()].filter(f => {
      if (activeLayer !== 'all' && f.layer !== activeLayer) return false;
      if (activeSprint && !f.sprints.includes(activeSprint)) return false;
      if (search) {
        const q = search.toLowerCase();
        if (!f.id.toLowerCase().includes(q) && !f.desc.toLowerCase().includes(q)) return false;
      }
      return true;
    });

    const groups = new Map();
    for (const f of filtered) {
      if (!groups.has(f.grp)) groups.set(f.grp, []);
      groups.get(f.grp).push(f);
    }

    if (filtered.length === 0) {
      listEl.innerHTML = '<div style="padding:18px" class="muted">ไม่พบไฟล์ที่ตรงเงื่อนไข</div>';
      return;
    }

    let html = '';
    for (const [grp, items] of groups) {
      html += `<div class="grp">${grp} (${items.length})</div>`;
      for (const f of items) {
        const isAct = f.id === selectedId;
        const isDim = sel && !related.has(f.id) && !search;
        html += `<button data-id="${f.id}" class="${isAct ? 'active' : ''} ${isDim ? 'dim' : ''}">
          <span class="lay" style="background:${LAYER_COLOR[f.layer]}"></span>${f.id.replace(/^(frontend|backend)\//, '$1/')}
        </button>`;
      }
    }
    listEl.innerHTML = html;
    listEl.querySelectorAll('button[data-id]').forEach(btn => {
      btn.addEventListener('click', () => select(btn.dataset.id));
    });
  }

  function renderDetail() {
    const f = map.get(selectedId);
    if (!f) return;
    const mkList = (arr, emptyMsg) => arr.length
      ? `<ul>${arr.map(id => {
          const t = map.get(id);
          const col = t ? LAYER_COLOR[t.layer] : 'var(--muted)';
          return `<li style="margin:6px 0"><button data-jump="${id}"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${col};margin-right:7px"></span>${id}</button></li>`;
        }).join('')}</ul>`
      : `<p class="muted small">${emptyMsg}</p>`;

    const sprintBadges = f.sprints.map(s => `<a href="sprint${s}.html" class="badge gray">Sprint ${s}</a>`).join(' ');
    const unusedWarn = (f.importedBy.length === 0 && !['frontend/index.html','frontend/my-schedule.html','frontend/serve.json','backend/src/server.js','db_design/sprint2_migration.sql','db_design/sprint3_migration.sql','.github/workflows/ci.yml'].includes(f.id))
      ? `<div class="callout warn"><span class="t">⚠️ ไม่พบไฟล์ที่ import ไฟล์นี้</span>ไฟล์นี้อาจเป็นไฟล์เก่าจาก Sprint ก่อนที่ถูกแทนที่แล้ว หรือถูกเรียกโดยตรงจากภายนอก</div>` : '';

    detailEl.innerHTML = `
      <div class="card ${f.layer}">
        <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px">
          <span class="badge ${f.layer}">${LAYER_NAME[f.layer]}</span>
          ${sprintBadges}
        </div>
        <h2 style="margin:6px 0 10px;border:0;padding:0;font-family:var(--mono);font-size:20px;word-break:break-all">${f.id}</h2>
        <p>${f.desc}</p>
        ${unusedWarn}
        <hr>
        <div class="rel">
          <div>
            <h4 style="margin-top:0">⬅️ ถูกเรียก / ถูก Import โดย (${f.importedBy.length})</h4>
            ${mkList(f.importedBy, 'ไม่มีไฟล์อื่น import (เป็นจุดเริ่มต้น, config หรือไฟล์เดี่ยว)')}
          </div>
          <div>
            <h4 style="margin-top:0">➡️ เรียกใช้ / Import ต่อไปที่ (${f.imports.length})</h4>
            ${mkList(f.imports, 'ไม่มีการ import ไฟล์ภายในโปรเจกต์ (เป็น leaf module / pure utility)')}
          </div>
        </div>
        <hr>
        <h4 style="margin-top:0">🔁 โค้ด / วิธีอื่นที่ใช้แทนได้</h4>
        <p class="small">${f.alt}</p>
      </div>
      <div class="callout note" style="margin-top:14px">
        <span class="t">💡 ทริกการใช้งาน</span>
        สังเกตรายชื่อทางซ้าย: ไฟล์ที่ <b>สว่างขึ้น</b> คือไฟล์ที่โยงกับไฟล์ที่คุณเลือกอยู่ ส่วนไฟล์ที่ <b>จางลง</b> คือไฟล์ที่ไม่เกี่ยวข้องโดยตรง — คลิกปุ่มในกล่อง ⬅️ หรือ ➡️ เพื่อกระโดดไล่สายงานต่อได้ทันที!
      </div>`;

    detailEl.querySelectorAll('[data-jump]').forEach(btn => {
      btn.addEventListener('click', () => {
        activeLayer = 'all'; activeSprint = null; search = ''; searchEl.value = '';
        updateFilterButtons();
        select(btn.dataset.jump);
      });
    });
  }

  function select(id) {
    selectedId = id;
    renderList();
    renderDetail();
  }

  function updateFilterButtons() {
    document.querySelectorAll('#fm-filters button').forEach(b => {
      const isLayerMatch = b.dataset.filter && b.dataset.filter === activeLayer && !activeSprint;
      const isSprintMatch = b.dataset.sprint && Number(b.dataset.sprint) === activeSprint;
      b.classList.toggle('primary', Boolean(isLayerMatch || isSprintMatch));
    });
  }

  document.querySelectorAll('#fm-filters button[data-filter]').forEach(b => b.addEventListener('click', () => {
    activeLayer = b.dataset.filter;
    activeSprint = null;
    updateFilterButtons();
    renderList();
  }));
  document.querySelectorAll('#fm-filters button[data-sprint]').forEach(b => b.addEventListener('click', () => {
    activeSprint = Number(b.dataset.sprint);
    activeLayer = 'all';
    updateFilterButtons();
    renderList();
  }));
  searchEl.addEventListener('input', () => { search = searchEl.value.trim(); renderList(); });

  select(selectedId);
})();
</script>
